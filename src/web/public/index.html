<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Skill Atlas</title>
  <link rel="stylesheet" href="/style.css">
  <script type="module" src="/app.js"></script>
</head>
<body>
  <header class="topbar">
    <a class="brand" href="./" data-home>
      <span class="brand-mark" aria-hidden="true">◆</span> Skill Atlas
    </a>
    <span class="topbar-note">Every agent skill in a repository or an organization</span>
  </header>

  <main class="page">
    <section id="catalog-view">
      <form id="scan-form" class="scan" autocomplete="off">
        <label class="scan-label" for="scan-url">GitHub repository or organization</label>
        <div class="scan-row">
          <input id="scan-url" name="url" class="input" type="text" inputmode="url" spellcheck="false"
                 placeholder="https://github.com/owner/repo or https://github.com/owner" required>
          <button id="scan-button" class="button button-primary" type="submit">Scan</button>
        </div>
        <p id="scan-error" class="alert alert-error" role="alert" hidden></p>
      </form>

      <div id="toolbar" class="toolbar" hidden>
        <input id="filter" class="input input-search" type="search" placeholder="Filter by name, description or path"
               aria-label="Filter skills">
        <span id="count" class="muted"></span>
        <button id="group" class="button" type="button" aria-pressed="false">Group by topic</button>
      </div>
      <p id="group-error" class="alert alert-error" role="alert" hidden></p>

      <div id="empty" class="empty">
        <p class="empty-title">Your catalog is empty</p>
        <p class="muted">Paste a repository or organization link above: every <code>SKILL.md</code> in it lands here.</p>
      </div>

      <div id="repositories"></div>
    </section>

    <section id="skill-view" hidden></section>
  </main>
</body>
</html>
